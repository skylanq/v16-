<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V16 Engine</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #080c12;
    color: #eef4ff;
    font-family: system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 20px;
  }
  main { width: min(1100px, 100%); }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 16px;
  }
  h1 { margin: 0; font-size: 36px; letter-spacing: 5px; }
  h1 span { color: #ff6539; }
  .sub { color: #8190a6; font-size: 13px; margin-top: 6px; }
  .badge {
    color: #ff966d;
    border: 1px solid #653326;
    border-radius: 30px;
    padding: 8px 14px;
    font-size: 12px;
    white-space: nowrap;
  }
  .panel {
    background: #101722;
    border: 1px solid #253044;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 80px #0008;
  }
  canvas { display: block; width: 100%; aspect-ratio: 1000 / 520; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 20px;
    padding: 22px;
    border-top: 1px solid #253044;
  }
  button {
    border: 0;
    border-radius: 10px;
    background: #ff6539;
    color: #fff;
    font-weight: 700;
    padding: 13px 20px;
    cursor: pointer;
  }
  button.secondary { background: #253044; }
  .throttle { flex: 1; min-width: 180px; }
  label {
    display: flex;
    justify-content: space-between;
    color: #9baac0;
    font-size: 12px;
    margin-bottom: 10px;
  }
  input { width: 100%; accent-color: #ff6539; }
  .readout { min-width: 125px; text-align: right; }
  .readout strong {
    font-size: 32px;
    font-variant-numeric: tabular-nums;
  }
  .readout small { color: #8292aa; }
  footer {
    padding: 14px 4px;
    color: #718098;
    font-size: 12px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>V<span>16</span></h1>
      <div class="sub">Два ряда по 8 цилиндров · четырехтактный цикл</div>
    </div>
    <div class="badge" id="status">ДВИГАТЕЛЬ ВЫКЛЮЧЕН</div>
  </header>

  <section class="panel">
    <canvas id="engine"></canvas>
    <div class="controls">
      <button id="start">▶ Запустить</button>
      <button class="secondary" id="sound">Звук: выкл.</button>
      <div class="throttle">
        <label for="rpm">
          <span>ОБОРОТЫ</span>
          <span>800 — 8000 RPM</span>
        </label>
        <input id="rpm" type="range" min="800" max="8000" value="1800" step="50">
      </div>
      <div class="readout">
        <strong id="value">0</strong>
        <small>RPM</small>
      </div>
    </div>
  </section>

  <footer>
    Голубой — впуск · фиолетовый — сжатие · оранжевый — рабочий ход · серый — выпуск.<br>
    Развернутая схема V16: движение замедлено для наглядности.
    Звук синтезируется браузером — начинай с небольшой громкости.
  </footer>
</main>

<script>
const canvas = document.querySelector("#engine");
const ctx = canvas.getContext("2d");
const slider = document.querySelector("#rpm");
const start = document.querySelector("#start");
const sound = document.querySelector("#sound");
const status = document.querySelector("#status");
const value = document.querySelector("#value");

const W = 1000, H = 520, TAU = Math.PI * 2;
let running = false, audioEnabled = false;
let currentRPM = 0, angle = 0, last = performance.now();
let audio, oscillator, gain, filter;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
}
window.addEventListener("resize", resize);
resize();

function rect(x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function line(x1, y1, x2, y2, color, width) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = "round";
  ctx.stroke();
}

function circle(x, y, r, fill) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fillStyle = fill;
  ctx.fill();
}

function text(str, x, y, size = 12, color = "#8395af") {
  ctx.fillStyle = color;
  ctx.font = `${size}px system-ui`;
  ctx.textAlign = "center";
  ctx.fillText(str, x, y);
}

function initAudio() {
  if (audio) return;
  audio = new (window.AudioContext || window.webkitAudioContext)();
  oscillator = audio.createOscillator();
  gain = audio.createGain();
  filter = audio.createBiquadFilter();

  oscillator.type = "sawtooth";
  filter.type = "lowpass";
  filter.frequency.value = 350;
  gain.gain.value = 0;

  oscillator.connect(filter);
  filter.connect(gain);
  gain.connect(audio.destination);
  oscillator.start();
}

start.onclick = () => {
  running = !running;
  start.textContent = running ? "■ Заглушить" : "▶ Запустить";
  status.textContent = running ? "ДВИГАТЕЛЬ РАБОТАЕТ" : "ДВИГАТЕЛЬ ВЫКЛЮЧЕН";
  if (audio) audio.resume();
};

sound.onclick = () => {
  initAudio();
  audio.resume();
  audioEnabled = !audioEnabled;
  sound.textContent = audioEnabled ? "Звук: вкл." : "Звук: выкл.";
};

function draw() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(500, 260, 20, 500, 260, 570);
  bg.addColorStop(0, "#1a283b");
  bg.addColorStop(1, "#0b1019");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = "#ffffff04";
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 25) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 25) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  text("BANK A  /  01—08", 490, 36, 12);
  text("BANK B  /  09—16", 490, 493, 12);

  rect(80, 55, 830, 160, 16, "#182231", "#35465e");
  rect(80, 305, 830, 160, 16, "#182231", "#35465e");

  // Крепления блока.
  for (const y of [67, 203, 317, 453]) {
    for (const x of [94, 896]) {
      circle(x, y, 5, "#47586f");
      line(x - 2, y, x + 2, y, "#101722", 2);
    }
  }

  // Центральный коленчатый вал.
  rect(65, 247, 870, 26, 10, "#42536a", "#6b7e99");
  line(73, 253, 925, 253, "#9eb3ce", 2);

  for (let i = 0; i < 8; i++) {
    const x = 145 + i * 100;
    for (let bank = 0; bank < 2; bank++) {
      const direction = bank === 0 ? -1 : 1;

      // Равномерно распределенные условные фазы зажигания.
      const firingIndex = i * 2 + bank;
      const phase = angle - firingIndex * Math.PI / 4;
      const cycle = ((phase % (TAU * 2)) + TAU * 2) % (TAU * 2);
      const stroke = Math.floor(cycle / Math.PI);
      const colors = ["#ff783b", "#8592a4", "#40c9ff", "#a685ff"];
      const color = colors[stroke];

      const pistonDistance = 105 + 23 * Math.cos(phase);
      const py = 260 + direction * pistonDistance;
      const pinX = x + Math.sin(phase) * 17;
      const pinY = 260 + direction * Math.cos(phase) * 17;
      const chamberY = bank === 0 ? 82 : 330;

      rect(x - 33, chamberY, 66, 108, 7, "#080e17", "#425570");

      // Камера между головкой цилиндра и поршнем.
      const gasTop = bank === 0 ? 86 : py + 10;
      const gasBottom = bank === 0 ? py - 10 : 434;
      ctx.globalAlpha = currentRPM > 30 ? 0.3 : 0.07;
      rect(x - 28, gasTop, 56, Math.max(0, gasBottom - gasTop), 3, color);
      ctx.globalAlpha = 1;

      // Шатун.
      line(pinX, pinY, x, py, "#080c12", 14);
      line(pinX, pinY, x, py, "#8092aa", 9);
      line(pinX - 1, pinY, x - 1, py, "#b3c2d5", 2);
      circle(pinX, pinY, 10, "#202d40");
      circle(pinX, pinY, 4, "#a8b9ce");

      // Поршень и кольца.
      const metal = ctx.createLinearGradient(x - 27, 0, x + 27, 0);
      metal.addColorStop(0, "#53667e");
      metal.addColorStop(0.45, "#d1ddeb");
      metal.addColorStop(1, "#627690");
      rect(x - 27, py - 11, 54, 22, 4, metal, "#e1ecff");
      line(x - 25, py - 6, x + 25, py - 6, "#38485e", 2);
      line(x - 25, py + 6, x + 25, py + 6, "#38485e", 2);
      circle(x, py, 4, "#42546b");

      // Свеча и краткая вспышка в начале рабочего хода.
      const sparkY = bank === 0 ? 86 : 434;
      rect(x - 4, sparkY - 7, 8, 14, 2, "#d8e4f1");

      if (cycle < 0.65 && currentRPM > 50) {
        const intensity = 1 - cycle / 0.65;
        const glow = ctx.createRadialGradient(
          x, sparkY, 1, x, sparkY, 34
        );
        glow.addColorStop(0, `rgba(255,245,185,${intensity})`);
        glow.addColorStop(0.35, `rgba(255,140,30,${intensity * 0.8})`);
        glow.addColorStop(1, "rgba(255,70,0,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(x - 34, sparkY - 34, 68, 68);
      }

      text(
        String(i + 1 + bank * 8).padStart(2, "0"),
        x, bank === 0 ? 76 : 456, 11, "#c0cee0"
      );
    }
  }

  // Маховик.
  ctx.save();
  ctx.translate(944, 260);
  circle(0, 0, 34, "#111b28");
  ctx.strokeStyle = "#657a96";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(0, 0, 31, 0, TAU);
  ctx.stroke();
  ctx.rotate(angle);
  for (let i = 0; i < 6; i++) {
    ctx.rotate(TAU / 6);
    line(9, 0, 26, 0, "#8da0ba", 5);
  }
  circle(0, 0, 9, "#ff6539");
  ctx.restore();

  text("CRANKSHAFT", 495, 290, 10, "#71839c");
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const target = running ? Number(slider.value) : 0;
  currentRPM += (target - currentRPM) * (1 - Math.exp(-dt * 2.2));
  if (!running && currentRPM < 1) currentRPM = 0;

  // Замедленная анимация сохраняет читаемость на высоких оборотах.
  angle += currentRPM / 60 * TAU * dt * 0.035;
  value.textContent = Math.round(currentRPM).toLocaleString("ru-RU");

  if (audio) {
    const t = audio.currentTime;
    oscillator.frequency.setTargetAtTime(
      Math.max(20, currentRPM / 60 * 8), t, 0.08
    );
    filter.frequency.setTargetAtTime(180 + currentRPM * 0.15, t, 0.1);
    gain.gain.setTargetAtTime(
      audioEnabled ? Math.min(currentRPM / 800, 1) * 0.055 : 0,
      t, 0.12
    );
  }

  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
